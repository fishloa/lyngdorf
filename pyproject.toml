[tool.poetry]
name = "lyngdorf"
version = "2.2.0"
description = "Library to control a Lyngdorf A/V processor"
authors = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.poetry.urls]
Homepage = "https://github.com/fishloa/lyngdorf"
Issues = "https://github.com/fishloa/lyngdorf/issues"

[tool.poetry.dependencies]
python = "^3.11"
aiohttp = ">=3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
black = "^26.0.0"
pytest-asyncio = "^1.0.0"
ruff = "^0.15.0"
mypy = "^1.19.1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
# The whole package is checked at `--strict` or better (spec D3, #49) -
# every flag `--strict` implies, enumerated, plus `warn_unreachable`,
# which it does not.
#
# Enumerated rather than `strict = true` so that upgrading mypy cannot
# silently change what CI enforces. A new check added to `--strict`
# upstream would otherwise arrive as a red build on an unrelated
# dependency bump, and this library's CI is a release gate for a
# consumer. The cost is the other half of the same trade: a new check is
# not adopted until someone adds it here deliberately, so re-diff this
# block against `--strict` when bumping mypy.
#
# (An earlier comment justified this as preventing a per-module
# exemption from disabling everything at once. That does not hold -
# mypy accepts `strict` in an override either way - so the real reason
# is recorded above instead.)
warn_unused_configs = true
warn_redundant_casts = true
strict_bytes = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
# Home Assistant's generated mypy.ini sets this, and a library has no
# business reasoning about a consumer's dead code while running a weaker
# check than the consumer does. Adopted after a shape shipped here that
# would have forced a None guard their gate then rejected as unreachable.
warn_unreachable = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
