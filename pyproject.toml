[tool.poetry]
name = "lyngdorf"
version = "1.10.0"
description = "Library to control a Lyngdorf A/V processor"
authors = ["Alex Fishlock <alex.fishlock@racingjag.com>"]
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.poetry.urls]
Homepage = "https://github.com/fishloa/lyngdorf"
Issues = "https://github.com/fishloa/lyngdorf/issues"

[tool.poetry.dependencies]
python = "^3.11"
aiohttp = ">=3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
black = "^26.0.0"
pytest-asyncio = "^1.0.0"
ruff = "^0.15.0"
mypy = "^1.19.1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
# Global halves of --strict. These two cannot live in a per-module
# override (mypy treats them as global-only); both verified no-op on the
# current 1.x modules before enabling.
warn_redundant_casts = true
strict_bytes = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true

# --- The 2.0 strict gate (spec D3) -----------------------------------
# Every module listed below is checked to the same standard as
# `mypy --strict`. Each work package appends the modules it creates or
# rewrites, so 2.0 code is born strict-clean; the 1.x modules stay under
# the lenient global config above until WP6 promotes the whole package.
#
# Why the flags are spelled out instead of `strict = true`: mypy 1.19.1
# accepts `strict = true` in an override SILENTLY but applies it
# GLOBALLY (measured: with only lyngdorf.exceptions listed, strict
# errors fired in lyngdorf/streaming.py and lyngdorf/models/). Do not
# "simplify" this block. The set below is --strict minus the three
# global-only flags (warn_unused_configs, warn_redundant_casts,
# strict_bytes), which are set in the global section above.
[[tool.mypy.overrides]]
module = [
    "lyngdorf.base",
    "lyngdorf.exceptions",
    "lyngdorf.streaming",
    "lyngdorf.streaming.client",
    "lyngdorf.streaming.parsers",
    "lyngdorf.streaming.types",
    "lyngdorf.rio",
    "lyngdorf.rio.protocol",
    "lyngdorf.rio.queue",
    "lyngdorf.rio.client",
    "lyngdorf.rio.dialects",
    "lyngdorf.controls",
    "lyngdorf.components",
    "lyngdorf.receiver",
    "lyngdorf.discovery",
    "lyngdorf.streaming.poll",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = "lyngdorf._compat"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true
disable_error_code = "attr-defined, no-any-return"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
