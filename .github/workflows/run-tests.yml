name: Run tests

on:
  push:
    branches: [ "main", "2.0" ]
  pull_request:
    branches: [ "main", "2.0" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          # Without this the matrix above is decorative: setup-python
          # falls back to the .python-version file, so adding a version
          # to the matrix would silently run the same Python twice.
          python-version: ${{ matrix.python-version }}
      - name: Install poetry
        uses: abatilo/actions-poetry@v2
      - name: Setup a local virtual environment (if no poetry.toml file)
        run: |
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local
      - uses: actions/cache@v6
        name: Define a cache for the virtual environment based on the dependencies lock file
        with:
          path: ./.venv
          key: venv-${{ hashFiles('poetry.lock') }}
      - name: Install the project dependencies
        run: poetry install
      - name: Check code formatting with Black
        run: poetry run black --check lyngdorf/ tests/
      - name: Lint with Ruff
        run: poetry run ruff check lyngdorf/ tests/
      - name: Type check with mypy
        # All configuration - including the per-module 2.0 strict gate -
        # lives in pyproject.toml. The CLI adds nothing, so CI and local
        # runs check exactly the same thing. CI's mypy comes from
        # poetry.lock (1.19.1), matching the pinned local binary.
        run: poetry run mypy lyngdorf/
      - name: Run the automated tests
        run: poetry run pytest -v
